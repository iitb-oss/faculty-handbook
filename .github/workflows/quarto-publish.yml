name: Render and Publish

on:
  push:
    branches: [main, master, quarto]
  pull_request:
    branches: [main, master, quarto]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # To install LaTeX to build PDF book
          tinytex: true

      - name: Install system dependencies and fonts
        run: |
          sudo apt-get update

          # Accept Microsoft EULA for core fonts
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections

          # Install fonts packages
          sudo apt-get install -y \
            ttf-mscorefonts-installer \
            fonts-liberation \
            fonts-liberation2 \
            fonts-dejavu-core \
            fonts-dejavu-extra \
            fonts-noto \
            fonts-noto-core \
            fontconfig \
            wget \
            unzip \
            cabextract

      - name: Install additional fonts
        run: |
          # Make install-fonts.sh executable and run it
          chmod +x install-fonts.sh
          ./install-fonts.sh

      - name: Verify fonts and refresh cache
        run: |
          # Update font cache multiple times to ensure registration
          sudo fc-cache -f -v
          fc-cache -f -v
          sleep 2
          sudo fc-cache -f -v

          # List available fonts for debugging
          echo "=== Checking for required fonts ==="
          echo "Checking Arial:"
          fc-list : family | grep -i "arial" | head -5 || echo "Arial not found"

          echo ""
          echo "Checking Liberation Sans:"
          fc-list : family | grep -i "liberation" | head -3 || echo "Liberation Sans not found"

          echo ""
          echo "Checking Ubuntu:"
          fc-list : family | grep -i "ubuntu" | head -3 || echo "Ubuntu fonts not found"

          echo ""
          echo "Checking Latin Modern:"
          fc-list : family | grep -i "lm\|latin modern" | head -3 || echo "Latin Modern fonts not found"

          echo ""
          echo "=== Total fonts available: ==="
          fc-list | wc -l

          echo ""
          echo "=== Checking Arial specifically for XeTeX: ==="
          fc-match Arial || echo "Arial cannot be matched"

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: all

      - name: Disable Jekyll and prepare PDF
        run: |
          # Create .nojekyll file in docs to prevent Jekyll processing
          touch docs/.nojekyll
          echo "Created .nojekyll file in docs/"
          ls -la docs/.nojekyll

          # Copy PDF with final name for download
          cp docs/IIT-Bombay-Faculty-Handbook.pdf docs/IITB-Faculty-Handbook.pdf
          echo "Copied PDF as IITB-Faculty-Handbook.pdf"
          ls -lh docs/IITB-Faculty-Handbook.pdf

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload docs directory (where Quarto outputs to)
          path: './docs'

  # Deployment job
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/quarto'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4