<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001a3d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5a623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7c05e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative geometric elements -->
  <circle cx="1050" cy="100" r="180" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="1100" cy="580" r="250" fill="#ffffff" fill-opacity="0.03"/>
  <circle cx="80" cy="500" r="120" fill="#f5a623" fill-opacity="0.06"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)"/>

  <!-- Left vertical accent line -->
  <rect x="80" y="80" width="5" height="470" fill="url(#accent)" rx="3"/>

  <!-- IIT Bombay logo placeholder text -->
  <text x="110" y="140" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#f5a623" letter-spacing="3" text-anchor="start">IIT BOMBAY</text>
  <text x="110" y="165" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.6" letter-spacing="1" text-anchor="start">INDIAN INSTITUTE OF TECHNOLOGY BOMBAY</text>

  <!-- Divider -->
  <rect x="110" y="185" width="400" height="1" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Main title -->
  <text x="110" y="270" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="start">Faculty</text>
  <text x="110" y="345" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="start">Handbook</text>

  <!-- Subtitle -->
  <text x="110" y="405" font-family="Arial, sans-serif" font-size="22" fill="#f5a623" text-anchor="start">A Comprehensive Guide for Faculty Members</text>

  <!-- Description -->
  <text x="110" y="455" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" fill-opacity="0.75" text-anchor="start">Policies · Procedures · Research · Campus Life</text>

  <!-- Bottom URL -->
  <text x="110" y="560" font-family="Arial, sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.45" text-anchor="start">saket-choudhary.me/my-iitb-faculty-handbook</text>

  <!-- Right side decorative book icon -->
  <g transform="translate(850, 230)" opacity="0.12">
    <rect x="0" y="0" width="220" height="280" rx="8" fill="#ffffff"/>
    <rect x="20" y="30" width="180" height="8" rx="4" fill="#003366"/>
    <rect x="20" y="55" width="140" height="8" rx="4" fill="#003366"/>
    <rect x="20" y="80" width="160" height="8" rx="4" fill="#003366"/>
    <rect x="20" y="120" width="180" height="8" rx="4" fill="#003366"/>
    <rect x="20" y="145" width="120" height="8" rx="4" fill="#003366"/>
    <rect x="20" y="170" width="150" height="8" rx="4" fill="#003366"/>
    <rect x="20" y="210" width="180" height="8" rx="4" fill="#003366"/>
    <rect x="20" y="235" width="100" height="8" rx="4" fill="#003366"/>
  </g>
</svg>
