image: debian:testing

pages:
  script:
    - echo 'deb http://deb.debian.org/debian testing main contrib non-free' >> /etc/apt/sources.list
    - apt update && apt -y install texlive-latex-extra pandoc make texlive-xetex fonts-ubuntu
    - make -B
    - mkdir -p public
    - cp out.pdf out.html *.css *.jpg public
  artifacts:
    paths:
      - public
