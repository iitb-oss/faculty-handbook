project:
  type: book
  output-dir: docs
  resources:
    - .nojekyll
    - robots.txt
    - iitb-og-card.png

website:
  site-url: "https://saket-choudhary.me/my-iitb-faculty-handbook"
  favicon: "favicon.ico"

book:
  title: "IIT Bombay Faculty Handbook"
  author: "IIT Bombay"
  date: "2025"
  description: "The official IIT Bombay Faculty Handbook — a comprehensive guide covering joining procedures, academic rules, research funding, salary, leave, promotion, retirement, and life at the Powai campus."
  site-url: "https://saket-choudhary.me/my-iitb-faculty-handbook"
  repo-url: "https://github.com/saketkc/my-iitb-faculty-handbook"
  repo-actions: [issue]
  open-graph:
    title: "IIT Bombay Faculty Handbook"
    description: "A comprehensive guide for IIT Bombay faculty — covering joining, academic rules, research funding, salary, leave policies, and life on campus."
    site-name: "IIT Bombay Faculty Handbook"
    image: "https://saket-choudhary.me/my-iitb-faculty-handbook/iitb-og-card.png"
  twitter-card:
    title: "IIT Bombay Faculty Handbook"
    description: "The official IIT Bombay Faculty Handbook — policies, procedures, and everything faculty need to know."
    card-style: summary_large_image
    image: "https://saket-choudhary.me/my-iitb-faculty-handbook/iitb-og-card.png"
  chapters:
    - index.qmd
    - preface.qmd
    - part: "About the Institute"
      chapters:
        - institute.qmd
    - part: "When You Join"
      chapters:
        - joining.qmd
        - regularization.qmd
        - erp-sap.qmd
        - resources.qmd
        - lab-space.qmd
        - medical.qmd
        - life-powai.qmd
        - leaving.qmd
    - part: "Expectations and Activities"
      chapters:
        - expectations.qmd
        - academic-rules.qmd
        - teaching-resources.qmd
        - research-funding.qmd
        - assessment-promotion.qmd
        - awards.qmd
        - continuing-education.qmd
        - consultancy.qmd
        - directorship.qmd
        - starting-company.qmd
        - conferences.qmd
    - part: "Rules and Regulations"
      chapters:
        - salary-allowances.qmd
        - cpda.qmd
        - rdf-ddf.qmd
        - leave-vacation.qmd
        - authorizations.qmd
        - financial-rules.qmd
        - procurement.qmd
        - ethics-conduct.qmd
        - rti.qmd
    - part: "Faculty Designations"
      chapters:
        - faculty-designations.qmd
    - part: "Retirement"
      chapters:
        - retirement.qmd
    - appendices.qmd
    - epilogue.qmd

format:
  html:
    theme:
      - cosmo
      - custom.scss
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 200px
    page-footer:
      left: "© 2025 IIT Bombay"
      right: "Faculty Handbook"
    downloads: [pdf]
    include-after-body: _include-after-body.html
  pdf:
    documentclass: amsbook
    classoption: [10pt, openany]
    geometry:
      - left=0.4in
      - right=0.4in
      - top=1in
      - bottom=1in
    papersize: a5
    pdf-engine: xelatex
    template: template.tex
    fontsize: 10pt
    toc: true
    toc-depth: 2
    secnumdepth: 3
    number-sections: true
    top-level-division: chapter
    colorlinks: true
    linkcolor: blue
    urlcolor: blue
    toccolor: blue
    include-in-header:
      - text: |
          \usepackage{fontspec}
          \usepackage{newunicodechar}
          \setmainfont{Arial}
          \setsansfont[Scale=MatchLowercase]{Arial}
          \newfontfamily{\rupeefont}{Noto Sans}[Scale=0.95]
          \newunicodechar{₹}{{\rupeefont ₹}}
          \usepackage{afterpage}
          \newcounter{none}
    keep-tex: true

execute:
  freeze: auto
